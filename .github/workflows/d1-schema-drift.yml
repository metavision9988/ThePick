name: D1 Schema Drift

# ============================================================
# Session 052 5-Persona DA-C3 흡수 — staging ↔ production schema drift CI 자동 검증.
#
# 배경 (DA-C3):
#   manual `wrangler d1 execute --command "SELECT sql FROM sqlite_master"` 의존 →
#   staging만 마이그레이션 적용되고 production 누락 시 BATCH CHECK constraint
#   failure 폭증 + 토큰 ~$30 매몰. 본 workflow가 양쪽 env 차이 자동 감지.
#
# Security note:
#   본 workflow는 신뢰할 수 없는 입력(github.event.*.title/body/head_ref 등) 직접 참조 0건.
#   secret만 env로 주입 + 모든 run: 명령 하드코딩. 외부 action은 공식 actions/* + pnpm 만 사용.
#
# 근거: .claude/reviews/review-20260507-154747-session-052-5-persona-tech-debt.md DA-C3
# ============================================================

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'apps/api/wrangler.toml'
      - '.github/workflows/d1-schema-drift.yml'
  pull_request:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'apps/api/wrangler.toml'
  workflow_dispatch: {}
  schedule:
    # 매일 KST 09:00 (UTC 00:00) — production hotfix 누적 drift 차단
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-drift:
    name: Compare staging and production D1 schema
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare secrets present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret 미설정 (settings/secrets/actions에 추가 필요)"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret 미설정"
            exit 1
          fi

      - name: Dump staging schema
        run: |
          cd apps/api
          pnpm exec wrangler d1 execute DB \
            --env staging --remote \
            --command "SELECT type, name, sql FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' AND name NOT LIKE 'd1_%' ORDER BY type, name" \
            --json > ../../staging-schema.json

      - name: Dump production schema
        run: |
          cd apps/api
          pnpm exec wrangler d1 execute DB \
            --env production --remote \
            --command "SELECT type, name, sql FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' AND name NOT LIKE 'd1_%' ORDER BY type, name" \
            --json > ../../production-schema.json

      - name: Normalize and diff schemas
        run: |
          jq -S '.[0].results' staging-schema.json > staging-normalized.json
          jq -S '.[0].results' production-schema.json > production-normalized.json
          if diff -u staging-normalized.json production-normalized.json > schema-diff.txt; then
            echo "PASS staging-production D1 schema 일치"
            exit 0
          else
            echo "::error::FAIL staging-production D1 schema drift 감지"
            echo "=================================================="
            cat schema-diff.txt
            echo "=================================================="
            echo "원인 후보:"
            echo "  1. 한쪽 env에만 마이그레이션 적용 - wrangler d1 migrations apply DB --remote --env <env>"
            echo "  2. production 수동 hotfix SQL - staging 동등 마이그레이션 추가 후 양쪽 재적용"
            echo "  3. wrangler migrations apply 부분 실패 - 로그 확인 후 재실행"
            exit 1
          fi

      - name: Upload schema diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-schema-drift-${{ github.run_id }}
          path: |
            staging-schema.json
            production-schema.json
            staging-normalized.json
            production-normalized.json
            schema-diff.txt
          retention-days: 30
