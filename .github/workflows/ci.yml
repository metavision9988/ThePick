name: CI

# Security note: 이 workflow는 신뢰할 수 없는 입력(${{ github.event.*.title/body }} 등)을 사용하지 않는다.
# 모든 run: 명령은 하드코딩되어 있고, 외부 action은 공식/검증된 것만 사용한다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare Workers types
        run: pnpm --filter @thepick/api cf-typegen

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test (packages with tests)
        run: |
          pnpm --filter @thepick/shared \
               --filter @thepick/formula-engine \
               --filter @thepick/parser \
               --filter @thepick/quality \
               --filter @thepick/batch \
               --filter @thepick/api \
               --filter @thepick/ai-adapter \
               --filter @thepick/admin-web \
               test

      # Step 18 — Engine Hardening 자동 검증 (master-test-checklist v1 / Cat 1+4+6+7).
      # vitest 합계 + Hard Rule 17 + 동적 코드 실행 차단 + XSS + console.* 회귀 방어.
      # 미달 시 exit 1 → CI 차단. JSON 결과는 artifact 로 업로드 (PR 리뷰 시 진척도 추적).
      #
      # 주의 (Pass 1+2 MAJOR-S1 흡수): `pnpm --filter @thepick/batch exec` 의 cwd 는
      # apps/batch/ 이므로 stdout 리다이렉트도 거기에 저장된다. upload-artifact 의 path 는
      # repo root 기준이라 명시적으로 apps/batch/ prefix 필요.
      - name: Verify engine contracts (Step 18 / M-2)
        run: pnpm --filter @thepick/batch exec tsx ../../scripts/verify-engine-contracts.ts --json > engine-contracts-report.json

      - name: Upload engine contracts report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-contracts-report
          path: apps/batch/engine-contracts-report.json
          retention-days: 30

      - name: Security audit (HIGH+ blocking, dev 포함)
        run: pnpm audit --audit-level=high

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
