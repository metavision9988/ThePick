name: CI

# Security note: 이 workflow는 신뢰할 수 없는 입력(${{ github.event.*.title/body }} 등)을 사용하지 않는다.
# 모든 run: 명령은 하드코딩되어 있고, 외부 action은 공식/검증된 것만 사용한다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare Workers types
        run: pnpm --filter @thepick/api cf-typegen

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      # parser 테스트는 pdfplumber subprocess 필요 — 러너에 venv 부재로 CI 가 장기 red
      # 였다(2026-07-10 진단: 최근 15+ run 전부 동일 실패). 로컬 개발 절차와 동일 경로.
      - name: Setup Python venv for parser (pdfplumber)
        run: |
          cd packages/parser
          python3 -m venv .venv
          .venv/bin/pip install --quiet pdfplumber

      # design-audit WS-0a (2026-06-10) — learning-modes(116)·srs(35) 추가.
      # 두 패키지는 test 필터 누락으로 CI 에서 151 테스트 미실행이었다(typecheck/lint 는
      # `pnpm -r` 로 이미 커버). verify-engine-contracts VITEST_PACKAGES 와 동시 등록.
      # 5-페르소나 P5(2026-07-10) D-01 — @thepick/web(74 유닛) 동일 클래스 재발 → 배선.
      - name: Test (packages with tests)
        run: |
          pnpm --filter @thepick/shared \
               --filter @thepick/formula-engine \
               --filter @thepick/parser \
               --filter @thepick/quality \
               --filter @thepick/batch \
               --filter @thepick/api \
               --filter @thepick/ai-adapter \
               --filter @thepick/admin-web \
               --filter @thepick/learning-modes \
               --filter @thepick/srs \
               --filter @thepick/web \
               test

      # 5-페르소나 리뷰(2026-07-02) MAJOR-4 — 루트 scripts/ 테스트는 workspace 밖이라
      # turbo 필터 미커버. golden 빌더 G-WS4 ② 게이트(byte-동치·leak·과제거 가드) 배선.
      - name: Test (root scripts — golden builder G-WS4)
        run: pnpm test:scripts

      # Step 18 — Engine Hardening 자동 검증 (master-test-checklist v1 / Cat 1+4+6+7).
      # vitest 합계 + Hard Rule 17 + 동적 코드 실행 차단 + XSS + console.* 회귀 방어.
      # 미달 시 exit 1 → CI 차단. JSON 결과는 artifact 로 업로드 (PR 리뷰 시 진척도 추적).
      #
      # 주의 (Pass 1+2 MAJOR-S1 흡수): `pnpm --filter @thepick/batch exec` 의 cwd 는
      # apps/batch/ 이므로 stdout 리다이렉트도 거기에 저장된다. upload-artifact 의 path 는
      # repo root 기준이라 명시적으로 apps/batch/ prefix 필요.
      - name: Verify engine contracts (Step 18 / M-2)
        run: pnpm --filter @thepick/batch exec tsx ../../scripts/verify-engine-contracts.ts --json > engine-contracts-report.json

      - name: Upload engine contracts report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-contracts-report
          path: apps/batch/engine-contracts-report.json
          retention-days: 30

      - name: Security audit (HIGH+ blocking, dev 포함)
        run: pnpm audit --audit-level=high

  # Step 3-UX-6g (ADR-040 §5 #7 흡수) — apps/web Playwright E2E 회귀 차단망.
  # Phase 3 launch toggle 의무 (ADR-040 §6 MAJOR-A5 carry-over 흡수, Session 075).
  # quality-gate와 병렬 실행 (browser install + dev server 부팅 시간 분리).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright 브라우저 binary cache — `apps/web/package.json` 변경 (Playwright 버전 회전) 시
      # 자동 invalidate. ~113MB chromium-headless-shell 다운로드 cache hit 시 ~5s 절약.
      # M1 흡수 (devops Pass 1, Session 076) — `restore-keys` partial fallback 추가.
      # Playwright 무관 devDep 추가/변경으로 exact-match 실패해도 직전 버전 cache 재사용
      # → 평균 ~50% 다운로드 절감. `install` 시 동일 버전 검증 후 skip하므로 회귀 위험 0.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright chromium + webkit (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @thepick/web exec playwright install --with-deps chromium webkit

      - name: Install system deps (cache hit — browser exists)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @thepick/web exec playwright install-deps chromium webkit

      - name: Run Playwright tests
        env:
          CI: 'true'
        run: pnpm --filter @thepick/web exec playwright test

      # 실패 시 trace + screenshot + video, 성공 시도 HTML report 보존 (PR 디버깅 단서).
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload Playwright test-results (실패 시 trace/video)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
