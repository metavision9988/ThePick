<script>

    61: 1887, 62: 1928, 63: 1969, 64: 2010, 65: 2050, 66: 2090, 67: 2130, 68: 2170, 69: 2210, 70: 2250,
    71: 2290, 72: 2329, 73: 2367, 74: 2405, 75: 2442, 76: 2479, 77: 2515, 78: 2551, 79: 2585, 80: 2619,

// 오리 일령별 중량 (g) - 일반 오리에만 해당
const duckMeatWeights = {
    1: 51, 2: 75, 3: 100, 4: 127, 5: 156, 6: 187, 7: 220, 8: 267, 9: 330, 10: 395,
    11: 461, 12: 529, 13: 598, 14: 668, 15: 748, 16: 838, 17: 930, 18: 1025, 19: 1120, 20: 1217,
    21: 1315, 22: 1417, 23: 1519, 24: 1621, 25: 1723, 26: 1825, 27: 1926, 28: 2027, 29: 2123, 30: 2219,
    31: 2315, 32: 2411, 33: 2506, 34: 2601, 35: 2696, 36: 2787, 37: 2873, 38: 2960, 39: 3046, 40: 3130,
    41: 3214, 42: 3293, 43: 3369, 44: 3434, 45: 3500
};

const poultryData = {
    breeder: {
        name: "종계",
        intro: "이 섹션에서는 종계의 주령에 따른 보험가액을 계산할 수 있습니다. 슬라이더로 사고 주령을 조절하고, 기준이 되는 31주령 가격을 입력하여 예상 보험가액을 확인하세요. 그래프는 주령에 따른 가치 변화를 보여줍니다.",
        inputs: [
            { id: 'age', label: '사고 주령 (주)', type: 'range', min: 1, max: 70, value: 31 },
            { id: 'price31w', label: '31주령 가격 (원)', type: 'number', value: 20000 },
            { id: 'chickPrice', label: '병아리 평균가격 (원)', type: 'number', value: 4000 },
            { id: 'oldChickenPrice', label: '노계 평균가격 (원)', type: 'number', value: 3000 },
        ],
        calculate: (vals) => {
            const { age, price31w, chickPrice, oldChickenPrice } = vals;
            let result, formula;
            if (age <= 2) {
                result = chickPrice;
                formula = `사고 당일 포함 직전 5영업일의 육용 종계 병아리 평균가격`;
            } else if (age >= 3 && age <= 6) {
                result = price31w * 0.3;
                formula = `31주령 가격 x 30%`;
            } else if (age >= 7 && age <= 30) {
                result = price31w * (1 - ((31 - age) * 0.028));
                formula = `31주령 가격 x (100% - ((31주령 - ${age}주령) x 2.8%))`;
            } else if (age === 31) {
                result = price31w;
                formula = `회사와 계약당시 협정한 가액 (31주령 가격)`;
            } else if (age >= 32 && age <= 61) {
                result = price31w * (1 - ((age - 31) * 0.026));
                formula = `31주령 가격 x (100% - ((${age}주령 - 31주령) x 2.6%))`;
            } else if (age >= 62 && age <= 64) {
                result = price31w * 0.2;
                formula = `31주령 가격 x 20%`;
            } else { // 65주 이상
                result = oldChickenPrice;
                formula = `사고 당일 포함 직전 5영업일의 종계 성계육 평균가격`;
            }
            return { value: Math.round(result), formula };
        },
        chartLabels: Array.from({ length: 70 }, (_, i) => `${i + 1}주`),
        summaryHtml: `
            <div class="mt-6 p-4 bg-emerald-50 rounded-lg border border-emerald-200">
                <h4 class="text-md font-bold text-emerald-700 mb-2">성계 보험가액 산정 기준 (참고)</h4>
                <ul class="list-disc list-inside text-sm text-stone-600 space-y-1">
                    
                    <li> <span class="font-semibold"> (병아리)  생후 2주 이하 : </span>사고 당일 포함 직전 5영업일의 육용 종계 병아리 평균가격 </li>
                    <li><span class="font-semibold">생후 3~6주:</span> 31주령 가격 x 30%</li>
                    <li><span class="font-semibold">생후 7~30주:</span> 31주령 가격 x (100% - ((31주령 - 사고주령) x 2.8%))</li>
                    <li><span class="font-semibold">생후 31주:</span> 회사와 계약당시 협정한 가액</li>
                    <li><span class="font-semibold">생후 32~61주:</span> 31주령 가격 x (100% - ((사고주령 - 31주령) x 2.6%))</li>
                    <li><span class="font-semibold">생후 62주~64주:</span> 31주령 가격 x 20%</li>
                    <li><span class="font-semibold">(노계)생후 65주 이상:</span> 사고 당일 포함 직전 5영업일의 종계 성계육 평균가격</li>
                </ul>
            </div>
        `
    },
    layer: {
        name: "산란계",
        intro: "이 섹션에서는 산란계의 주령에 따른 보험가액을 계산합니다. 각 단계(병아리, 중추, 산란계)에 필요한 가격 정보를 입력하고 주령을 조절하여 결과를 확인하세요. 산란계 단계의 가치는 계란 가격과 생산비에 따라 변동됩니다.",
        inputs: [
            { id: 'age', label: '사고 주령 (주)', type: 'range', min: 1, max: 80, value: 20 },
            { id: 'chickPrice', label: '산란실용계 병아리 가격 (원)', type: 'number', value: 1000 },
            { id: 'pulletPrice', label: '산란중추 가격 (원)', type: 'number', value: 4500 },
            { id: 'hen20wPrice', label: '20주 산란계 가격 (원)', type: 'number', value: 5500 },
            { id: 'eggPrice', label: '계란 1개 평균가격 (원)', type: 'number', value: 150 },
            { id: 'oldHenPrice', label: '산란노계 평균가격 (원)', type: 'number', value: 2000 },
        ],
        calculate: (vals) => {
            const { age, chickPrice, pulletPrice, hen20wPrice, eggPrice, oldHenPrice } = vals;
            const EGG_PROD_COST = 77;
            let result, formula;

            if (age <= 1) {
                result = chickPrice;
                formula = `산란실용계 병아리 평균가격`;
            } else if (age >= 2 && age <= 9) {
                result = chickPrice + ((pulletPrice - chickPrice) / 9) * (age - 1);
                formula = `병아리가격 + ((중추가격 - 병아리가격) / 9) x (${age}주 - 1주)`;
            } else if (age >= 10 && age <= 15) {
                result = pulletPrice;
                formula = `사고 당일 포함 직전 5영업일의 산란중추 평균가격`;
            } else if (age >= 16 && age <= 19) {
                result = pulletPrice + ((hen20wPrice - pulletPrice) / 5) * (age - 15);
                formula = `산란중추가격 + ((20주 산란계가격 - 산란중추가격) / 5) x (${age}주 - 15주)`;
            } else if (age >= 20 && age <= 70) {
                const accidentDays = age * 7; // 사고 주령을 일령으로 변환
                const netEggPrice = Math.max(10, eggPrice - EGG_PROD_COST);
                result = (550 - accidentDays) * 0.7 * netEggPrice;
                formula = `(550일 – 사고일령(${accidentDays}일)) x 70% x (계란 평균가(${eggPrice}원) – 계란 생산비(${EGG_PROD_COST}원))`;
            } else { // 71주 이상
                result = oldHenPrice;
                formula = `사고 당일 포함 직전 5영업일의 산란성계육 평균가격`;
            }
            return { value: Math.round(result), formula };
        },
        chartLabels: Array.from({ length: 80 }, (_, i) => `${i + 1}주`),
        summaryHtml: `
            <div class="mt-6 p-4 bg-emerald-50 rounded-lg border border-emerald-200">
                <h4 class="text-md font-bold text-emerald-700 mb-2">산란계 보험가액 산정 기준 (참고)</h4>
                <ul class="list-disc list-inside text-sm text-stone-600 space-y-1">
                    <li><span class="font-semibold">병아리 생후 1주 이하:</span> 사고 당일 포함 직전 5영업일의 산란실용계 병아리 평균가격</li>
                    <li><span class="font-semibold">병아리 생후 2~9주:</span> 산란실용계병아리가격 + ((산란중추가격 – 산란실용계 병아리가격) / 9) x ( 사고주령 – 1주령 )</li>
                    <li><span class="font-semibold">중추 생후 10~15주:</span> 사고 당일 포함 직전 5영업일의 산란중추 평균가격</li>
                    <li><span class="font-semibold">중추 생후 16~19주:</span> 산란중추가격 + ((20주 산란계가격 - 산란중추가격) / 5) x (사고주령 – 15주령 )</li>
                    <li><span class="font-semibold">산란계 생후 20~70주:</span> (550일 – 사고일령) x 70% x (사고 당일 포함 직전 5영업일의 계란 1개 평균가격 – 계란 1개의 생산비)</li>
                    <li><span class="font-semibold">산란노계 생후 71주 이상:</span> 사고 당일 포함 직전 5영업일의 산란성계육 평균가격</li>
                    <li class="mt-2"><span class="font-semibold">※ 계란 1개 평균가격:</span> 중량규격(왕란/특란/대란이하)별 사고 당일 포함 직전 5영업일 평균가격을 중량규격별 비중(왕란 2.0%, 특란 53.5%, 대란 이하 44.5%)으로 가중평균한 가격</li>
                    <li><span class="font-semibold">※ 계란 1개의 생산비:</span> 77원</li>
                    <li><span class="font-semibold">※ 참고:</span> 사고 당일 포함 직전 5영업일의 계란 1개 평균가격에서 계란 1개의 생산비를 공제한 결과가 10원 이하인 경우 10원으로 한다.</li>
                </ul>
            </div>
        `
    },
    broiler: {
        name: "육계",
        intro: "육계의 보험가액을 계산합니다. 육용실용계 병아리 가격과 육계 평균가격을 입력하고, 일령을 선택하여 사고 육계의 보험가액을 확인하세요. 삼계 여부를 선택할 수 있습니다.",
        inputs: [
            { id: 'day', label: '사고 일령 (일)', type: 'range', min: 0, max: 45, value: 20 },
            { id: 'chickPrice', label: '병아리 평균가격 (원)', type: 'number', value: 500 },
            { id: 'meatPrice', label: '육계 평균가격 (원/kg)', type: 'number', value: 3500 },

let currentChart = null;

function formatCurrency(value) {
    if (value === null || isNaN(value)) return 'N/A';
    return `${value.toLocaleString('ko-KR')} 원`;
}

// 화면 요소 캡처 및 다운로드 함수 (main-container div를 캡처)
function captureElementAsImage(elementId, fileName) {
    const element = document.getElementById(elementId);
    if (!element) {
        console.error("Element not found for ID:", elementId);
        return;
    }

    // 로딩 오버레이 표시
    const loadingOverlay = document.getElementById('loading-overlay');
    loadingOverlay.classList.remove('hidden');

    html2canvas(element, {
        useCORS: true,
        // scrollY, windowWidth, windowHeight, foreignObjectRendering 옵션 제거
        onclone: (clonedDoc) => {
            const originalInputs = element.querySelectorAll('input[type="number"], input[type="text"]');
            originalInputs.forEach(originalInput => {
                const clonedInput = clonedDoc.getElementById(originalInput.id);
                if (clonedInput) {
                    const span = clonedDoc.createElement('span');
                    span.textContent = originalInput.value;
                    span.className = clonedInput.className;
                    span.style.display = 'inline-block';
                    span.style.padding = window.getComputedStyle(clonedInput).padding;
                    span.style.border = window.getComputedStyle(clonedInput).border;
                    span.style.borderRadius = window.getComputedStyle(clonedInput).borderRadius;
                    span.style.backgroundColor = window.getComputedStyle(clonedInput).backgroundColor;
                    span.style.color = window.getComputedStyle(clonedInput).color;
                    span.style.fontFamily = window.getComputedStyle(clonedInput).fontFamily;
                    span.style.fontSize = window.getComputedStyle(clonedInput).fontSize;
                    span.style.lineHeight = window.getComputedStyle(clonedInput).lineHeight;
                    span.style.textAlign = window.getComputedStyle(clonedInput).textAlign;
                    span.style.verticalAlign = window.getComputedStyle(clonedInput).verticalAlign;
                    clonedInput.parentNode.replaceChild(span, clonedInput);
                }
            });
        }
    }).then(canvas => {
        const image = canvas.toDataURL("image/png");
        const link = document.createElement('a');
        link.download = fileName;
        link.href = image;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }).catch(error => {
        console.error("Error capturing element:", error);
    }).finally(() => {
        // 로딩 오버레이 숨기기
        loadingOverlay.classList.add('hidden');
    });
}

        if (currentChart) {
            currentChart.destroy();
            currentChart = null;
        }
        return;
    }

    const inputsHTML = data.inputs.map(input => {
        if (input.type === 'checkbox') {
            return `
                <div class="flex items-center">
                    <input type="checkbox" id="${input.id}-${tabId}" ${input.value ? 'checked' : ''} class="h-4 w-4 text-emerald-600 focus:ring-emerald-500 border-stone-300 rounded">
                    <label for="${input.id}-${tabId}" class="ml-2 block text-sm font-medium text-stone-600">${input.label}</label>

                        </div>

                        <div class="chart-container">

                        </div>
                    </div>

function addEventListeners(tabId) {
    const data = poultryData[tabId];
    data.inputs.forEach(input => {
        const inputEl = document.getElementById(`${input.id}-${tabId}`);
        if (inputEl) {
            inputEl.addEventListener('input', () => {
                if (input.type === 'range') {
                    document.getElementById(`${input.id}-value-${tabId}`).textContent = `${inputEl.value} ${input.label.includes('주') ? '주' : (input.label.includes('일') ? '일' : '')}`;
                }
                updateCalculations(tabId);
            });
            if (input.type === 'checkbox') {
                 inputEl.addEventListener('change', () => {
                     updateCalculations(tabId);
                 });
            }
        }
    });

    // Capture button for the entire main content
    let mainContentCaptureButton = document.getElementById(`capture-full-screen`);
    if (!mainContentCaptureButton) { // 버튼이 없으면 새로 생성
        mainContentCaptureButton = document.createElement('button');
        mainContentCaptureButton.id = `capture-full-screen`;
        mainContentCaptureButton.className = 'mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-md shadow-sm transition-colors duration-200';
        mainContentCaptureButton.textContent = '현재 화면 캡처';
        document.querySelector('.container.mx-auto').appendChild(mainContentCaptureButton);
    }
    
    // 이벤트 리스너는 한 번만 추가
    mainContentCaptureButton.onclick = () => { // 기존 addEventListener 대신 onclick으로 대체 (이전 리스너 제거 없이 업데이트)
        const activeTabName = document.querySelector('.tab-button.active')?.textContent || '알 수 없음';
        const currentInputs = getInputs(tabId);
        const ageOrDayValue = currentInputs.age || currentInputs.day || '';
        const unit = data.inputs.some(input => input.id === 'age') ? '주령' : (data.inputs.some(input => input.id === 'day') ? '일령' : '');
        
        captureElementAsImage('main-container', `${activeTabName}_보험가액_화면_${ageOrDayValue}${unit}.png`);
    };

    // 기존 차트 캡처 버튼 제거 (원치 않는 기능이므로)
    const oldCaptureButton = document.getElementById(`capture-content-${tabId}`);
    if (oldCaptureButton && oldCaptureButton.parentNode) {
        oldCaptureButton.parentNode.removeChild(oldCaptureButton);
    }
}

function getInputs(tabId) {
    const data = poultryData[tabId];
    const values = {};
    data.inputs.forEach(input => {
        const inputEl = document.getElementById(`${input.id}-${tabId}`);
        if (input.type === 'checkbox') {
            values[input.id] = inputEl.checked;
        } else {
            values[input.id] = Number(inputEl.value);
        }
    });
    return values;
}

function updateCalculations(tabId) {
    const data = poultryData[tabId];
    const inputs = getInputs(tabId);
    const result = data.calculate(inputs);

    document.getElementById(`result-value-${tabId}`).textContent = formatCurrency(result.value);
    const formulaEl = document.getElementById(`result-formula-${tabId}`);
    formulaEl.textContent = result.formula || '';
    if(result.type) {
        formulaEl.textContent = `[${result.type}] ${formulaEl.textContent}`;
    }

    updateChart(tabId, inputs);
}

function updateChart(tabId, currentInputs) {
    const data = poultryData[tabId];
    const ctx = document.getElementById(`poultryChart-${tabId}`)?.getContext('2d');
    if (!ctx) return;

    if (currentChart) {
        currentChart.destroy();
    }
    
    const chartDataPoints = data.chartLabels.map((label, index) => {
        let ageOrDay;
        // Adjust based on label format (e.g., "X주", "X일")
        if (label.includes('주')) {
            ageOrDay = parseInt(label.replace('주', ''));
        } else if (label.includes('일')) {
            ageOrDay = parseInt(label.replace('일', ''));
        } else {
            ageOrDay = index; // Fallback if no specific unit in label
        }

        const tempInputs = { ...currentInputs };
        if (data.inputs.some(input => input.id === 'age')) {
            tempInputs.age = ageOrDay;
        } else if (data.inputs.some(input => input.id === 'day')) {
            tempInputs.day = ageOrDay;
        }
        
        return data.calculate(tempInputs).value;
    });

    const currentInputAgeOrDay = currentInputs.age || currentInputs.day;
    const pointBackgroundColors = data.chartLabels.map((label) => {
        let ageOrDay;
        if (label.includes('주')) {
            ageOrDay = parseInt(label.replace('주', ''));
        } else if (label.includes('일')) {
            ageOrDay = parseInt(label.replace('일', ''));
        } else {
            ageOrDay = 0; // Should not happen with proper labels
        }
        return ageOrDay === currentInputAgeOrDay ? '#047857' : '#6ee7b7';
    });
     const pointRadius = data.chartLabels.map((label) => {
        let ageOrDay;
        if (label.includes('주')) {
            ageOrDay = parseInt(label.replace('주', ''));
        } else if (label.includes('일')) {
            ageOrDay = parseInt(label.replace('일', ''));
        } else {
            ageOrDay = 0; // Should not happen with proper labels
        }
        return ageOrDay === currentInputAgeOrDay ? 6 : 3;
    });

    currentChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: data.chartLabels,
            datasets: [{
                label: `${data.name} 보험가액 (원)`,
                data: chartDataPoints,
                borderColor: '#059669',
                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                fill: true,
                tension: 0.4,
                pointBackgroundColor: pointBackgroundColors,
                pointRadius: pointRadius,
                pointHoverRadius: 8,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false,
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            let label = context.dataset.label || '';
                            if (label) {
                                label += ': ';
                            }
                            if (context.parsed.y !== null) {
                                label += formatCurrency(context.parsed.y);
                            }
                            return label;
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value, index, values) {
                            return (value / 1000) + 'k';
                        }
                    }
                },
                x: {
                   ticks: {
                       autoSkip: true,
                       maxTicksLimit: 15,
                       callback: function(value, index, values) {
                           const labelText = this.getLabelForValue(value);
                           const labelValue = parseInt(labelText.replace(/[^0-9]/g, ''));
                           
                           // Logic to determine if it's '일' or '주'
                           if (labelText.includes('일')) {
                               return `${labelValue}일`;
                           } else if (labelText.includes('주')) {
                               return `${labelValue}주`;
                           }
                           return labelText; // Fallback
                       }
                   }
                }
            }
        }
    });
}

document.addEventListener('DOMContentLoaded', () => {
    const tabContainer = document.getElementById('tab-container');
    const tabs = tabContainer.querySelectorAll('.tab-button');

    tabContainer.addEventListener('click', (e) => {
        if (e.target.classList.contains('tab-button')) {
            const tabId = e.target.dataset.tab;
            tabs.forEach(tab => tab.classList.remove('active'));
            e.target.classList.add('active');
            renderContent(tabId);
        }
    });

    renderContent('breeder');
});
</script>
