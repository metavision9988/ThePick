# engine.contract.yaml — formula-engine
# 양식: VOID ENGINE DESIGN CONSTITUTION v3.0 부록 A
# 위치: 모노레포 권장 (packages/{name}/contract.yaml 미러 가능)

engine:
  name: "@thepick/formula-engine"
  version: "0.1.0"
  status: "contracted"  # contracted → in_progress → review → done → deprecated

  classification:
    scope: "micro"
    determinism: "deterministic"
    statefulness: "stateless"
    isolation: "process"  # Node.js 로컬 (BATCH 환경)

  domain_profile:
    primary: "library"
    secondary: ["batch-build"]

  defcon: "L3"
  defcon_reason: "AI/ML 추론의 정답 근거 + Stateful Meta(apps/batch)가 의존하는 결정자. 산식 결함 1건 = 서비스 사망."

  composition_pattern: "N/A"   # Library: lifecycle 없음, 호출 시점에만 작동
  parent_meta_engine: "apps/batch (Pattern A Pipeline 내부 호출)"

  slo:
    tier: "Library"  # v3.0 Vol XV
    build_correctness: 0.999
    build_reproducibility:
      invariant_fields:
        - "calculation_result_value"
        - "formula_AST_hash"
        - "variable_resolution_order"
      invariant_threshold: 1.0
      tolerable_fields: []  # 결정성 100%, 허용 변동 없음
      tolerance_threshold: 0.0
      test_method: "property_test"
      test_iterations: 100
      seed_fixed: true
    latency_p99_ms: 50  # Library SLO 참고치 (호출 시점)
    cost_per_calculation_usd: 0  # 외부 호출 0건 (LLM/DB 미경유)

  # Single-Vendor Lock-in (ADR-022)
  single_vendor:
    enabled: true
    vendor: "cloudflare"
    accepted_lock_in_years: 5
    note: "Library 자체는 벤더 무관. 호출 사이트(apps/batch)가 Cloudflare 종속"

interface:
  inputs:
    - name: "formulaId"
      type: "string"
      svf_role: "scalar"
      validation:
        - "matches /^F-\\d{2}$/"
        - "exists in registry"
    - name: "scope"
      type: "FormulaScope"
      svf_role: "scalar"
      validation:
        - "all required variables present"
        - "all variables match VariableSchema"
    - name: "constantsProvider"
      type: "ConstantsProvider"
      svf_role: "vector"  # 콜백 — 방향성 있음
      validation:
        - "implements get(constantId): Promise<number | null>"

  outputs:
    - name: "result"
      type: "CalculateResult"
      svf_role: "scalar"
      validation:
        - "result.value: finite number (no NaN, no Infinity)"
        - "result.unit matches formula definition"
        - "result.lineage includes all variable bindings"

  errors:
    - "MISSING_VARIABLE"
    - "INVALID_VARIABLE_TYPE"
    - "OUT_OF_RANGE"
    - "CONSTANT_NOT_FOUND"
    - "AST_PARSE_FAILED"
    - "DIVISION_BY_ZERO"
    - "OVERFLOW"

# Library Engine — Lifecycle 5종 N/A (v3.0 Vol XV.2)
lifecycle:
  applies: false
  reason: "Library Engine — 식별 3문항만 적용 (Q4 관측, Q5 lifecycle = N/A)"

# AIEC N/A (Library, 엔진 간 통신 없음)
aiec:
  applies: false

# LLM 통합 — formula-engine 자체는 LLM 미사용
llm_integration:
  enabled: false
  note: "LLM이 산식을 호출할 수는 있으나, formula-engine 자체는 결정적 코드. LLM 통합은 호출 사이트의 책임 (LLM_CONTAINMENT.md Layer 2 의미 검증의 입력)"

acceptance_criteria:
  - id: "AC-FE-1"
    description: "68개 산식 모두 Golden Test 통과"
    verification: "test_passes"
    test_path: "src/__tests__/batch1~5-golden.test.ts"
    threshold: "100%"

  - id: "AC-FE-2"
    description: "동일 (formulaId, scope, constants) 입력 → 100회 반복 시 100회 동일 출력"
    verification: "property_test"
    test_path: "src/__tests__/determinism.property.test.ts"
    iterations: 100
    threshold: 1.0

  - id: "AC-FE-3"
    description: "Sandbox 화이트리스트 우회 시도 0건 통과"
    verification: "property_test"
    test_path: "src/__tests__/sandbox.test.ts"
    scenarios: ["dynamic_function_definition", "global_access", "prototype_pollution"]

  - id: "AC-FE-4"
    description: "산식 변수명 ↔ schema 일치 등록 시 자동 검증"
    verification: "function_exists"
    targets: ["formulas/index.ts:safeParse_validation"]

  - id: "AC-FE-5"
    description: "ConstantsProvider 인터페이스 만족 시 InMemory/D1/Mock 교체 가능 (Q2)"
    verification: "function_exists"
    targets: ["constants-resolver.ts:InMemoryConstantsProvider"]
    note: "Phase 1 후반 D1ConstantsProvider 추가 시 동일 인터페이스 검증"

  - id: "AC-FE-6"
    description: "외부 의존 0 — math.js 외 npm 패키지 미사용 (Q3)"
    verification: "package_audit"
    target: "packages/formula-engine/package.json"
    allowed_dependencies: ["mathjs"]

constraints:
  - "동적 코드 실행 함수 사용 금지 (CLAUDE.md Hard Limit)"
  - "결정성 보장 — 동일 입력 → 동일 출력 (시드 불요, math.js 자체 결정성)"
  - "DB 직접 접근 금지 — ConstantsProvider 인터페이스 경유"
  - "HTTP 호출 금지"
  - "파일 I/O 금지"
  - "출력은 finite number — NaN/Infinity 발생 시 FormulaError throw"

adr_triggers:
  - "math.js 메이저 버전 변경"
  - "ConstantsProvider 인터페이스 변경"
  - "산식 레지스트리 구조 변경 (현재 BATCH별 정의 파일)"
  - "Sandbox 화이트리스트 추가/삭제"
  - "BigNumber 정밀도 정책 변경"

first_heartbeat:
  status: "achieved"
  achieved_date: "2026-04-26"  # Phase 0 BATCH1~5 Golden Test 통과 시점
  achieved_scenario: "BATCH-1 fixture 산식 5건 모두 Golden Test 통과"

contract_review:
  breaker_verified: false  # Step 6 검수 후 true
  omission_warnings: []
  loosened_constraints: []
  scope_gaps: []

# Library 의무 5요소 (Vol XV.3)
library_obligations:
  - obligation: "Property Test (Tier 4) — 결정성 회귀 차단"
    status: "pending"
    target_step: "Engine Hardening Step 13"
  - obligation: "engine.contract.yaml — Silent Pivot 방지"
    status: "in_progress"
    target_step: "Step 6 (본 파일)"
  - obligation: "Semantic Versioning"
    status: "compliant"
    note: "v0.1.0 (pre-1.0)"
  - obligation: "TypeScript strict"
    status: "compliant"
    note: "tsconfig.json strict: true 확인 필요 (Step 18)"
  - obligation: "100% 단위 커버리지 (수치 라이브러리)"
    status: "partial"
    note: "현재 Golden Test 5건. Property Test 추가 후 재측정"
