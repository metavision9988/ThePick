<!-- Tailwind Play CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>

    theme: {
      extend: {
        fontFamily: {
          sans: ['Pretendard', 'Pretendard Variable', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],

</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Pretendard', 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  /* RFP token: 본문 줄간격 1.7, 제목 1.3 */
  .tp-body { line-height: 1.7; }
  .tp-tight { line-height: 1.3; }
  /* lock pretendard inside artboards even when DC injects its own font on header */
  .tp-art { font-family: 'Pretendard', 'Pretendard Variable', -apple-system, system-ui, sans-serif; }
  /* hide scrollbars inside artboards (DC already does this for .dc-card *) */
</style>
